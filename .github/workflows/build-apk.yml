name: Build APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Unit tests and debug builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test Sherpa JNI contract checker
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Run tests and build debug APKs
        run: >-
          ./gradlew :app:testLiteDebugUnitTest :app:testFullDebugUnitTest
          :app:assembleLiteDebug :app:assembleFullDebug
          :app:assembleFullDebugAndroidTest --console=plain

  build:
    name: Build release APK (full + lite)
    # Fork pull requests never receive release signing secrets. They are still
    # validated by the unsigned verify job above; signed builds remain available
    # for same-repository PRs and explicit maintainer workflow dispatches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download speech models (full variant only)
        working-directory: docs
        run: bash download-models.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build release APKs
        run: ./gradlew assembleFullRelease assembleLiteRelease
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify Sherpa JNI names after R8
        run: python3 -B scripts/check_sherpa_jni_mapping.py

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: moqi-im-android-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Upload lite APK
        uses: actions/upload-artifact@v4
        with:
          name: moqi-im-android-lite-release
          path: app/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error
